# 이 파일은 앱만 올린다. gwon-db 는 여기 없다.
# docker compose down 은 backend/frontend/cloudflare 만 내린다.
# --remove-orphans 금지 (공용 gwon-db 가 내려감).

services:

  backend: # Express API (gwon.run/api/*)
    container_name: gwon-backend
    restart: always
    build: ./backend
    environment:
      PORT: 8080
      DB_HOST: gwon-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: gwon
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # 키가 없어도 배포는 되도록 기본값 지정 (없으면 /BINANCE 잔고 조회만 비활성)
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - global_network

  frontend: # Vite 정적 빌드 서빙 (gwon.run/*)
    container_name: gwon-frontend
    restart: always
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_API_BASE: /api
    expose:
      - "5173"
    networks:
      - global_network
    depends_on:
      - backend

  cloudflare: # Cloudflare 터널
    image: cloudflare/cloudflared:latest
    container_name: gwon-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - global_network
    depends_on:
      - frontend
      - backend

networks:
  global_network:
    external: true
